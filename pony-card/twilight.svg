  <image href="https://files.everypony.me/smiles/twilight/5.gif" x="325" y="205" width="32" height="32" />
  <image href="https://files.everypony.me/smiles/twilight/6.gif" x="325" y="245" width="32" height="32" />
  <image href="https://files.everypony.me/smiles/twilight/7.gif" x="325" y="285" width="32" height="32" />
  <image href="https://files.everypony.me/smiles/twilight/8.gif" x="325" y="325" width="32" height="32" />
</svg>
