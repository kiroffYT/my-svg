<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" /> <stop offset="50%" stop-color="#1e1b4b" /> <stop offset="100%" stop-color="#090d16" /> </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" /> <stop offset="100%" stop-color="#a78bfa" /> </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="100" rx="12" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="50" cy="50" r="40" fill="#7e22ce" opacity="0.15" filter="url(#glow)" />
  <circle cx="750" cy="50" r="40" fill="#2563eb" opacity="0.12" filter="url(#glow)" />

  <g transform="translate(0, 0)">
    <text x="50" y="59" font-family="'Times New Roman', serif" font-size="24" font-weight="800" fill="url(#accentGradient)" letter-spacing="1">
      НОВЫЕ ФАНФИКИ
    </text>
    
    <line x1="310" y1="30" x2="310" y2="70" stroke="#334155" stroke-width="1.5" />
    
    <text x="330" y="58" font-family="'Times New Roman', serif" font-size="18" font-weight="600" fill    ="#e2e8f0">
      Каждую субботу <tspan fill="#a78bfa">|</tspan> <tspan fill="#38bdf8">19:00 МСК</tspan>
    </text>
    
    <line x1="580" y1="30" x2="580" y2="70" stroke="#334155" stroke-width="1.5" />
    
    <text x="600" y="57" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill    ="#475569" letter-spacing="1.5">
      ДО КОНЦА ЛЕТА
    </text>
  </g>

  <path d="M 15 25 L 15 15 L 25 15" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 785 75 L 785 85 L 775 85" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
