<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" /> <stop offset="50%" stop-color="#1e1b4b" /> <stop offset="100%" stop-color="#020617" /> </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" /> <stop offset="100%" stop-color="#a78bfa" /> </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="480" height="340" rx="20" fill="url(#bgGradient)"/>

  <circle cx="440" cy="100" r="80" fill="#2563eb" opacity="0.1" filter="url(#glow)" /> <circle cx="60" cy="240" r="100" fill="#7e22ce" opacity="0.1" filter="url(#glow)" /> <rect x="20" y="20" width="440" height="300" rx="15" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
  
  <text x="240" y="90" text-anchor="middle" font-family="'Times New Roman', serif" font-size="28" font-weight="bold" fill="#64748b" letter-spacing="4">
    НАПОМИНАНИЕ
  </text>

  <text x="240" y="160" text-anchor="middle" font-family="'Times New Roman', serif" font-size="40" font-weight="888" fill="url(#accentGradient)" letter-spacing="1">
    НОВЫЕ ФАНФИКИ
  </text>

  <g transform="translate(240, 220)">
    <rect x="-180" y="-35" width="360" height="60" rx="30" fill="#ffffff" opacity="0.03"/>
    <rect x="-180" y="-35" width="360" height="60" rx="30" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.3"/>
    
    <text x="0" y="0" text-anchor="middle" font-family="'Times New Roman', serif" font-size="20" font-weight="600" fill="#e2e8f0">
      Каждую субботу <tspan fill="#a78bfa">|</tspan> 19:00 МСК
    </text>
  </g>

  <text x="240" y="280" text-anchor="middle" font-family="'Times New Roman', serif" font-size="20" font-weight="500" fill="#475569" letter-spacing="2">
    ДО КОНЦА ЛЕТА
  </text>

  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/> <path d="M 450 50 L450 30 L 430 30" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" opacity="0.6"/> <path d="M 30 290 L 30 310 L 50 310" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" opacity="0.6"/> <path d="M 450 290 L 450 310 L 430 310" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
