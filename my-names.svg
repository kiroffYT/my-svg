<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;display=swap');
      
      .pixel-text-title {
        font-family: 'VT323', monospace;
        font-size: 64px;
        fill: #ffffff;
        font-smooth: never;
        -webkit-font-smoothing: none;
        letter-spacing: 0.5px;
      }

      .pixel-text-body {
        font-family: 'VT323', monospace;
        font-size: 48px;
        fill: #000000;
        font-smooth: never;
        -webkit-font-smoothing: none;
      }

      /* Стиль для текста внутри кнопки ОК */
      .pixel-text-btn {
        font-family: 'VT323', monospace;
        font-size: 38px;
        fill: #000000;
        font-smooth: never;
        -webkit-font-smoothing: none;
      }
    </style>

    <filter id="xp-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="5" dy="5" stdDeviation="5" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="xp-titlebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a1c46d" />
      <stop offset="10%" stop-color="#bcd88f" />
      <stop offset="25%" stop-color="#7ca83c" />
      <stop offset="85%" stop-color="#578022" />
      <stop offset="100%" stop-color="#3c5f11" />
    </linearGradient>

    <linearGradient id="xp-close-btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d7532a" />
      <stop offset="40%" stop-color="#e36c41" />
      <stop offset="85%" stop-color="#b0310f" />
      <stop offset="100%" stop-color="#8a1f05" />
    </linearGradient>

    <linearGradient id="xp-olive-btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b4d485" />
      <stop offset="40%" stop-color="#7ba43b" />
      <stop offset="85%" stroke="#496e19" stop-color="#496e19" />
      <stop offset="100%" stop-color="#33510e" />
    </linearGradient>

    <linearGradient id="xp-btn-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fcfbfa" />
      <stop offset="85%" stop-color="#e3decb" />
      <stop offset="100%" stop-color="#d6cfb7" />
    </linearGradient>
    
    <mask id="window-mask">
      <rect x="10" y="10" width="1890" height="580" rx="8" ry="8" fill="white" />
      <rect x="10" y="45" width="1890" height="545" fill="white" />
    </mask>
  </defs>

  <g filter="url(#xp-shadow)">
    <rect x="10" y="10" width="1890" height="870" fill="#f1efe2" stroke="#578022" stroke-width="3" rx="7" />

    <g mask="url(#window-mask)">
      <rect x="10" y="10" width="1890" height="84" fill="url(#xp-titlebar)" />
    </g>

    <text x="25" y="72" class="pixel-text-title">
      Мои альтернативные имена и никнеймы
    </text>

    <g transform="translate(1660, 17) scale(2.5)">
      <rect width="26" height="26" rx="3" fill="url(#xp-olive-btn)" stroke="#ffffff" stroke-width="1" />
      <rect x="5" y="17" width="16" height="4" fill="#ffffff" />
    </g>

    <g transform="translate(1740, 17) scale(2.5)">
      <rect width="26" height="26" rx="3" fill="url(#xp-olive-btn)" stroke="#ffffff" stroke-width="1" />
      <rect x="5" y="6" width="16" height="14" fill="none" stroke="#ffffff" stroke-width="2" />
      <rect x="6" y="5" width="14" height="4" fill="#ffffff" />
    </g>

    <g transform="translate(1820, 17) scale(2.5)">
      <rect width="28" height="26" rx="3" fill="url(#xp-close-btn)" stroke="#ffffff" stroke-width="1" />
      <path d="M8,7 L20,19 M20,7 L8,19" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>

    <rect x="15" y="97" width="1880" height="776" fill="#ffffff" stroke="#716f64" stroke-width="1" />
    
    <text x="40" y="160" class="pixel-text-body">
      Лайм Спарк (Вспышка Зелени) - имя моего персонажа. Живёт в своём ТГК.
    </text>
    <text x="40" y="225" class="pixel-text-body">
      NotElseDJ (NE-DJ) - псевдоним в музыкальном мире. На данный момент треков нет.
    </text>
    <text x="40" y="290" class="pixel-text-body">
      TwilightBoy - произошло от того, что я фанател от Искорки и её характера.
    </text>
    <text x="40" y="355" class="pixel-text-body">
      0x2342 - предполгается как второй муз. псевдоним, но уже для экспериментов.
    </text>
    <text x="40" y="420" class="pixel-text-body">
      ki.dev <tspan font-size="24">(читать как "Ки-дэв")</tspan> - название моего канала на YouTube про ПК и их мир.
    </text>
    <text x="700" y="515" class="pixel-text-body">
      Временно неиспользуемое
    </text>
    <text x="40" y="610" class="pixel-text-body">
      Мистер Капот
    </text>
    <text x="450" y="610" class="pixel-text-body">
      Жёсткий Откалиброванный Поляризатор Аккордеона
    </text>
    <text x="40" y="690" class="pixel-text-body">
      Кимороно (キモロノ)
    </text>
    <text x="600" y="690" class="pixel-text-body">
      Koftochka (Кофточка)
    </text>
    <text x="1200" y="690" class="pixel-text-body">
      КилькаЗавр
    </text>
    <text x="120" y="825" class="pixel-text-body">
      Возможно, список будет пополняться, так что готовьтесь :)
    </text>

    <g transform="translate(1680, 780)">
      <rect width="180" height="65" rx="3" fill="none" stroke="#316ac5" stroke-width="1" />
      <rect x="1" y="1" width="178" height="63" rx="2" fill="url(#xp-btn-face)" stroke="#7f9db9" stroke-width="1" />
      <text x="90" y="44" class="pixel-text-btn" text-anchor="middle">ОК</text>
    </g>

  </g>
</svg>
